{% extends "master.html" %}
{% load static %}

{% block title %}Complaint Submitted{% endblock %}

{% block content %}

<a href="{% url 'user_dashboard' %}" class="back-arrow">←</a>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow border-0 text-center p-5" style="max-width: 600px; background-color: #f8f9fa;">
    <div class="card-body">
      <div class="mb-4">
        <i class="bi bi-check-circle-fill" style="font-size: 4rem; color: #2e7d32;"></i>
      </div>
      <h3 class="fw-bold text-success mb-3">Complaint Submitted Successfully!</h3>
      <p class="text-muted mb-4">
        Your complaint has been registered successfully. Our team will review and take necessary action.
      </p>
      <a href="{% url 'submitted_complaints' %}" class="btn btn-primary" style="background-color: #1d3557; border: none;">
        View My Complaints
      </a>
    </div>
  </div>
</div>

<style>
body {
  background-color: #f1f3f6;
}

.back-arrow {
  position: absolute;
  top: 20px;
  left: 25px;
  font-size: 2rem;
  color: #1d3557;
  text-decoration: none;
  font-weight: bold;
}

.back-arrow:hover {
  color: #0b1d33;
}
</style>

{% endblock %}
