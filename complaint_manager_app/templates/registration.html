{% extends "master.html" %}
{% load static %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div class="register-page d-flex align-items-center justify-content-center"
     style="min-height: 100vh; background-color: #f7f8fa;">

  <div class="card shadow-lg p-5 bg-white rounded-4 text-center"
       style="width: 420px; border-top: 6px solid #003366;">
       
    <h1 class="fw-bold mb-3" style="color:#003366;">Create Account</h1>

    {% if error %}
      <p class="error_messages text-danger fw-semibold mb-3">{{ error }}</p>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <input type="text" name="username" placeholder="Username"
               class="form-control form-control-lg" required>
      </div>
      <div class="mb-3">
        <input type="email" name="email" placeholder="Email"
               class="form-control form-control-lg" required>
      </div>
      <div class="mb-3">
        <input type="password" name="password" placeholder="Password"
               class="form-control form-control-lg" required>
      </div>
      <div class="mb-4">
        <input type="password" name="confirm_password" placeholder="Confirm Password"
               class="form-control form-control-lg" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold"
              style="background-color:#003366; border:none;">
        Sign Up
      </button>
    </form>

    <div class="mt-4">
      <span class="text-muted">Already have an account?</span>
      <a href="{% url 'login' %}" class="fw-semibold" style="color:#003366; text-decoration:none;">
        Login
      </a>
    </div>
  </div>
</div>

<style>
  .form-control:focus {
    border-color: #003366;
    box-shadow: 0 0 0 2px rgba(0, 51, 102, 0.2);
  }

  .card {
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
{% endblock %}
