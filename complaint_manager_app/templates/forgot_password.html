{% extends "master.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="forgot-password-page d-flex align-items-center justify-content-center"
     style="min-height: 100vh; background-color: #f7f8fa; position: relative;">

  <!-- Back Arrow -->
  <a href="{% url 'login' %}"
     class="position-absolute top-0 start-0 m-4 text-decoration-none"
     style="font-size: 2rem; color: #003366;">←</a>

  <!-- Forgot Password Box -->
  <div class="card shadow-lg p-5 bg-white rounded-4 text-center"
       style="width: 400px; border-top: 6px solid #003366;">
    <h2 class="fw-bold mb-3" style="color:#003366;">Forgot Password</h2>
    <p class="text-muted mb-4">Enter your registered email address to reset your password.</p>

    <form method="post">
      {% csrf_token %}
      <div class="mb-4 text-start">
        <label for="email" class="form-label fw-semibold">Email Address</label>
        <input type="email" name="email" id="email"
               class="form-control form-control-lg"
               placeholder="Enter your email" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-semibold"
              style="background-color:#003366; border:none;">
        Continue
      </button>
    </form>

    {% if messages %}
      <div class="mt-4">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} mt-2 mb-0" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  </div>
</div>

<style>
  .form-control:focus {
    border-color: #003366;
    box-shadow: 0 0 0 2px rgba(0, 51, 102, 0.2);
  }

  .card {
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
{% endblock %}
